<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師隨機抽選系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pulse-animation {
            animation: pulse 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-white dark:bg-[#181818] text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
    <!-- Password Protection Screen -->
    <div id="passwordScreen" class="fixed inset-0 bg-gradient-to-br from-primary to-purple-600 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl p-8 max-w-md w-full mx-4">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100">教師抽選系統</h2>
                <p class="text-gray-600 dark:text-gray-400 mt-2">請輸入密碼以繼續</p>
            </div>

            <div class="mb-6">
                <label for="passwordInput" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">密碼</label>
                <input
                    type="password"
                    id="passwordInput"
                    class="w-full px-4 py-3 text-base border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition-colors"
                    placeholder="請輸入密碼"
                    onkeypress="if(event.key === 'Enter') checkPassword()">
                <div id="passwordError" class="mt-2 text-red-500 text-sm hidden">密碼錯誤，請重試</div>
            </div>

            <button
                onclick="checkPassword()"
                class="w-full bg-primary hover:bg-opacity-90 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg">
                登入
            </button>
        </div>
    </div>

    <div id="mainContent" class="container mx-auto px-4 py-8 max-w-4xl hidden">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-2 text-primary">2026-27 教師隨機抽選系統</h1>
            <p class="text-gray-600 dark:text-gray-400">快速、公平地隨機抽取教師</p>
        </header>

        <!-- Employee List Section -->
        <div class="bg-gray-50 dark:bg-gray-900 rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">教師名單管理</h2>

            <div class="mb-4">
                <label for="employeeInput" class="block text-sm font-medium mb-2">輸入教師名單（每行一個名字）</label>
                <textarea
                    id="employeeInput"
                    rows="10"
                    class="w-full px-4 py-3 text-base border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-800 transition-colors"
                    placeholder="張三&#10;李四&#10;王五&#10;..."></textarea>
            </div>

            <div class="flex flex-wrap gap-3">
                <button
                    onclick="saveEmployeeList()"
                    class="flex-1 min-w-[140px] bg-primary hover:bg-opacity-90 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg">
                    保存名單
                </button>
                <button
                    onclick="clearEmployeeList()"
                    class="flex-1 min-w-[140px] bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg">
                    清空名單
                </button>
            </div>

            <div id="employeeCount" class="mt-4 text-sm text-gray-600 dark:text-gray-400"></div>
        </div>

        <!-- Draw Section -->
        <div class="bg-gray-50 dark:bg-gray-900 rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">抽選設定</h2>

            <div class="mb-4">
                <label for="drawCount" class="block text-sm font-medium mb-2">抽取人數</label>
                <input
                    type="number"
                    id="drawCount"
                    value="6"
                    min="1"
                    class="w-full px-4 py-3 text-base border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-800 transition-colors">
            </div>

            <button
                onclick="drawEmployees()"
                class="w-full bg-gradient-to-r from-primary to-purple-600 hover:from-primary hover:to-purple-700 text-white font-bold py-4 px-6 rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl text-lg">
                🎲 開始抽選
            </button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="bg-gradient-to-br from-primary to-purple-600 rounded-lg shadow-lg p-6 hidden">
            <h2 class="text-2xl font-semibold mb-6 text-white text-center">抽選結果</h2>
            <div id="results" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            <div class="mt-6 text-center">
                <button
                    onclick="drawEmployees()"
                    class="bg-white text-primary hover:bg-gray-100 font-semibold py-3 px-6 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg">
                    重新抽選
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full p-6 fade-in">
            <h3 id="modalTitle" class="text-xl font-semibold mb-3"></h3>
            <p id="modalMessage" class="text-gray-700 dark:text-gray-300 mb-6"></p>
            <div class="flex justify-end">
                <button
                    onclick="closeModal()"
                    class="px-6 py-2 bg-primary text-white hover:bg-opacity-90 rounded-lg transition-colors">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        // Dark mode support
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        const CORRECT_PASSWORD = 'ndc1967';
        let employees = [];

        // Password check function
        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('passwordError');

            if (input.value === CORRECT_PASSWORD) {
                document.getElementById('passwordScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                error.classList.add('hidden');
            } else {
                error.classList.remove('hidden');
                input.value = '';
                input.focus();
                // Add shake animation
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 500);
            }
        }

        // Default employee list
        const defaultEmployeeList = `蔣佩儀
歐陽子榮
陳思言
陳梓蓉
周海瑛
鄭敏婷
卓婷
蔡婉儀
馮嘉峪
馮潔怡
馮淑群
何幗彥
何倩怡
許敏琪
許憬希
許玉妹
郭子欽
黎慧勤
林紫芬
林偉鴻
林永亮
林煥然
劉曉鋒
羅家意
李伊迪
李紹宏
李慧賢
梁家騏
李秀程
盧可欣
李凱琪
呂寶琪
馬樂文
莫榮華
柯建榮
潘紫藝
彭嘉煒
蘇潁汛
鄧志恒
鄭臻諺
曾慧儀
蔡啟源
王婷婷
黃雅琪
黃嘉進
王金鑾
鄧琨澄
黃美鴻
胡啟源
楊佩華
姚美芝
姚韻芳
姚欽和`;

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Focus on password input
            document.getElementById('passwordInput').focus();

            // Load default employee list
            document.getElementById('employeeInput').value = defaultEmployeeList;
            employees = defaultEmployeeList.split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 0);
            updateEmployeeCount();
        });

        function showModal(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function saveEmployeeList() {
            const input = document.getElementById('employeeInput').value;
            employees = input.split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 0);

            if (employees.length === 0) {
                showModal('錯誤', '請輸入至少一位教師名字');
                return;
            }

            updateEmployeeCount();
            showModal('成功', `已保存 ${employees.length} 位教師的名單`);
        }

        function clearEmployeeList() {
            document.getElementById('employeeInput').value = '';
            employees = [];
            updateEmployeeCount();
            document.getElementById('resultsSection').classList.add('hidden');
        }

        function updateEmployeeCount() {
            const countDiv = document.getElementById('employeeCount');
            if (employees.length > 0) {
                countDiv.textContent = `目前共有 ${employees.length} 位教師`;
            } else {
                countDiv.textContent = '';
            }
        }

        function drawEmployees() {
            if (employees.length === 0) {
                showModal('錯誤', '請先保存教師名單');
                return;
            }

            const drawCount = parseInt(document.getElementById('drawCount').value);

            if (drawCount < 1) {
                showModal('錯誤', '抽取人數必須至少為 1');
                return;
            }

            if (drawCount > employees.length) {
                showModal('錯誤', `抽取人數 (${drawCount}) 不能超過教師總數 (${employees.length})`);
                return;
            }

            // Shuffle and pick
            const shuffled = [...employees].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, drawCount);

            displayResults(selected);
        }

        function displayResults(selected) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            selected.forEach((name, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-gray-800 rounded-lg p-4 shadow-md fade-in';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center font-bold mr-3">
                            ${index + 1}
                        </div>
                        <div class="text-lg font-semibold text-gray-900 dark:text-gray-100">${name}</div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });

            const resultsSection = document.getElementById('resultsSection');
            resultsSection.classList.remove('hidden');
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
