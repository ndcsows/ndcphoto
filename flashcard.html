<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班際同學姓名閃卡記憶系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 flex flex-wrap justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-white text-indigo-600 p-2 rounded-xl shadow-inner font-bold text-xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">班級同學名字閃卡系統</h1>
                <p class="text-xs text-indigo-200">輕鬆記住每一位學生，支援 CSV 批次匯入與管理</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-2 mt-2 sm:mt-0">
            <button onclick="switchTab('study')" id="btn-study" class="px-3.5 py-2 bg-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-800 transition shadow">
                <i class="fa-solid fa-clone mr-1"></i> 學習閃卡
            </button>
            <button onclick="switchTab('quiz')" id="btn-quiz" class="px-3.5 py-2 bg-indigo-500 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow">
                <i class="fa-solid fa-gamepad mr-1"></i> 互動測驗
            </button>
            <button onclick="switchTab('manage')" id="btn-manage" class="px-3.5 py-2 bg-indigo-500 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow">
                <i class="fa-solid fa-users-gear mr-1"></i> 名單管理 (<span id="student-count-badge">21</span>人)
            </button>
            <button onclick="switchTab('batch')" id="btn-batch" class="px-3.5 py-2 bg-indigo-500 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow">
                <i class="fa-solid fa-file-csv mr-1"></i> CSV 批次匯入
            </button>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 sm:p-6 max-w-4xl">
        
        <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform transition-all">
                <div id="modal-icon" class="text-3xl text-indigo-600 mb-3 text-center"></div>
                <h3 id="modal-title" class="text-lg font-bold text-center text-slate-800 mb-2">提示</h3>
                <p id="modal-message" class="text-sm text-slate-600 text-center mb-5"></p>
                <div class="flex justify-center">
                    <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-xl transition shadow">確定</button>
                </div>
            </div>
        </div>

        <!-- STUDY TAB -->
        <section id="tab-study" class="space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-sm font-semibold text-slate-500" id="study-counter">卡片 1 / 21</span>
                <div class="space-x-2">
                    <button onclick="prevCard()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition">
                        <i class="fa-solid fa-chevron-left"></i> 上一張
                    </button>
                    <button onclick="nextCard()" class="px-3 py-1.5 bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl text-sm font-medium transition">
                        下一張 <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Flashcard Container -->
            <div class="flex justify-center">
                <div id="flashcard" onclick="flipCard()" class="w-full max-w-md h-96 perspective-1000 cursor-pointer">
                    <div id="card-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-3xl">
                        <!-- Front (Photo) -->
                        <div class="absolute inset-0 w-full h-full bg-white rounded-3xl p-6 flex flex-col items-center justify-center backface-hidden border border-slate-100">
                            <div class="w-56 h-56 rounded-2xl overflow-hidden shadow-md bg-slate-100 flex items-center justify-center mb-4">
                                <img id="study-img" src="" alt="同學照片" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/e2e8f0/475569?text=No+Photo'">
                            </div>
                            <p class="text-xs text-slate-400 font-medium bg-slate-100 px-3 py-1 rounded-full"><i class="fa-regular fa-hand-pointer mr-1"></i> 點擊卡片查看名字</p>
                        </div>
                        <!-- Back (Name) -->
                        <div class="absolute inset-0 w-full h-full bg-indigo-600 text-white rounded-3xl p-6 flex flex-col items-center justify-center backface-hidden rotate-y-180 shadow-lg">
                            <h2 id="study-name" class="text-4xl font-bold tracking-wider mb-2">同學姓名</h2>
                            <p class="text-xs text-indigo-200">再次點擊卡片翻回照片</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center">
                <button onclick="shuffleCards()" class="text-sm bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium py-2 px-4 rounded-xl shadow-sm transition">
                    <i class="fa-solid fa-shuffle mr-1"></i> 隨機洗牌
                </button>
            </div>
        </section>

        <!-- QUIZ TAB -->
        <section id="tab-quiz" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center">
                <div id="quiz-setup" class="space-y-4">
                    <h2 class="text-xl font-bold text-slate-800">測驗模式設定</h2>
                    <p class="text-sm text-slate-500">測試你對全班同學姓名的熟悉度！</p>
                    <button onclick="startQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-2xl shadow-lg transition">
                        <i class="fa-solid fa-play mr-2"></i> 開始測驗
                    </button>
                </div>

                <div id="quiz-game" class="hidden space-y-6">
                    <div class="flex justify-between items-center text-sm font-semibold text-slate-500">
                        <span id="quiz-progress">題目 1 / 21</span>
                        <span id="quiz-score" class="text-indigo-600">得分: 0</span>
                    </div>

                    <div class="w-48 h-48 mx-auto rounded-2xl overflow-hidden shadow-md bg-slate-100 flex items-center justify-center">
                        <img id="quiz-img" src="" alt="測驗照片" class="w-full h-full object-cover">
                    </div>

                    <p class="text-lg font-medium text-slate-700">這位同學叫什麼名字？</p>
                    
                    <div id="quiz-options" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-md mx-auto">
                        <!-- Options generated dynamically -->
                    </div>
                </div>

                <div id="quiz-result" class="hidden space-y-4 py-8">
                    <div class="text-6xl text-indigo-600 mb-2">🎉</div>
                    <h2 class="text-2xl font-bold text-slate-800">測驗完成！</h2>
                    <p id="final-score-text" class="text-lg text-slate-600">你的最終得分是：0 / 21</p>
                    <button onclick="startQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-xl shadow transition">
                        重新測驗
                    </button>
                </div>
            </div>
        </section>

        <!-- MANAGE TAB -->
        <section id="tab-manage" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">同學名單管理</h2>
                        <p class="text-xs text-slate-500">檢視、修改或更新同學的相片與名字</p>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 px-4 rounded-xl shadow transition">
                            <i class="fa-solid fa-plus mr-1"></i> 新增同學
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400">
                                <th class="py-3 px-4">相片預覽 / Base64</th>
                                <th class="py-3 px-4">姓名</th>
                                <th class="py-3 px-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body" class="divide-y divide-slate-50 text-sm">
                            <!-- Rows generated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- BATCH CSV TAB -->
        <section id="tab-batch" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">CSV 批次匯入與編輯</h2>
                        <p class="text-xs text-slate-500">上傳 CSV 檔案或直接貼上 CSV 格式文字，以批次更新所有 21 位同學的名單與 Base64 相片。</p>
                    </div>
                    <button onclick="downloadCSVTemplate()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium py-2 px-3 rounded-xl transition">
                        <i class="fa-solid fa-download mr-1"></i> 下載 CSV 範本
                    </button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">選擇 CSV 檔案上傳</label>
                        <input type="file" id="csv-file-input" accept=".csv" onchange="handleCSVFileUpload(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">或直接在下方貼上 CSV 文字格式 (格式: 姓名, 圖片網址或Base64)</label>
                        <textarea id="csv-text-input" rows="8" class="w-full border border-slate-200 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-indigo-600" placeholder="陳大文,data:image/jpeg;base64,...&#10;李小龍,https://placehold.co/200x200..."></textarea>
                    </div>

                    <div class="flex justify-end space-x-2">
                        <button onclick="exportCurrentToCSV()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition">
                            <i class="fa-solid fa-file-export mr-1"></i> 匯出目前名單為 CSV
                        </button>
                        <button onclick="importCSVData()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition shadow">
                            <i class="fa-solid fa-upload mr-1"></i> 確認批次更新
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Add/Edit Modal -->
        <div id="student-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <h3 id="modal-form-title" class="text-lg font-bold text-slate-800">編輯同學資料</h3>
                <input type="hidden" id="edit-index" value="-1">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">同學姓名</label>
                    <input type="text" id="input-name" class="w-full border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-600" placeholder="例如：陳大文">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">相片 (Base64 字串或圖片網址)</label>
                    <textarea id="input-photo" rows="4" class="w-full border border-slate-200 rounded-xl px-4 py-2 text-xs font-mono focus:outline-none focus:border-indigo-600" placeholder="data:image/png;base64,..."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button onclick="closeStudentModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-medium transition">取消</button>
                    <button onclick="saveStudent()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition">儲存</button>
                </div>
            </div>
        </div>

    </main>

        ];

        let currentStudyIndex = 0;
        let isFlipped = false;
        
        let quizQuestions = [];
        let currentQuizIndex = 0;
        let quizScore = 0;

        function updateCounts() {
            document.getElementById('student-count-badge').innerText = students.length;
        }

        function showModal(title, message, iconClass = "fa-solid fa-circle-info") {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerHTML = `<i class="${iconClass}"></i>`;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function switchTab(tab) {
            document.getElementById('tab-study').classList.add('hidden');
            document.getElementById('tab-quiz').classList.add('hidden');
            document.getElementById('tab-manage').classList.add('hidden');
            document.getElementById('tab-batch').classList.add('hidden');
            
            document.getElementById('btn-study').className = "px-3.5 py-2 bg-indigo-500 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow";
            document.getElementById('btn-quiz').className = "px-3.5 py-2 bg-indigo-500 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow";
            document.getElementById('btn-manage').className = "px-3.5 py-2 bg-indigo-500 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow";
            document.getElementById('btn-batch').className = "px-3.5 py-2 bg-indigo-500 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow";

            if (tab === 'study') {
                document.getElementById('tab-study').classList.remove('hidden');
                document.getElementById('btn-study').className = "px-3.5 py-2 bg-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-800 transition shadow";
                updateStudyCard();
            } else if (tab === 'quiz') {
                document.getElementById('tab-quiz').classList.remove('hidden');
                document.getElementById('btn-quiz').className = "px-3.5 py-2 bg-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-600 transition shadow";
                resetQuizView();
            } else if (tab === 'manage') {
                document.getElementById('tab-manage').classList.remove('hidden');
                document.getElementById('btn-manage').className = "px-3.5 py-2 bg-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-800 transition shadow";
                renderStudentTable();
            } else if (tab === 'batch') {
                document.getElementById('tab-batch').classList.remove('hidden');
                document.getElementById('btn-batch').className = "px-3.5 py-2 bg-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-800 transition shadow";
                prepareCSVTextarea();
            }
            updateCounts();
        }

        function updateStudyCard() {
            if (students.length === 0) return;
            if (currentStudyIndex >= students.length) currentStudyIndex = 0;
            const student = students[currentStudyIndex];
            document.getElementById('study-img').src = student.photo;
            document.getElementById('study-name').innerText = student.name;
            document.getElementById('study-counter').innerText = `卡片 ${currentStudyIndex + 1} / ${students.length}`;
            
            if (isFlipped) {
                flipCard();
            }
        }

        function flipCard() {
            const inner = document.getElementById('card-inner');
            isFlipped = !isFlipped;
            if (isFlipped) {
                inner.style.transform = 'rotateY(180deg)';
            } else {
                inner.style.transform = 'rotateY(0deg)';
            }
        }

        function nextCard() {
            currentStudyIndex = (currentStudyIndex + 1) % students.length;
            updateStudyCard();
        }

        function prevCard() {
            currentStudyIndex = (currentStudyIndex - 1 + students.length) % students.length;
            updateStudyCard();
        }

        function shuffleCards() {
            for (let i = students.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [students[i], students[j]] = [students[j], students[i]];
            }
            currentStudyIndex = 0;
            updateStudyCard();
            showModal("洗牌完成", "閃卡順序已隨機重新排列！", "fa-solid fa-shuffle");
        }

        function resetQuizView() {
            document.getElementById('quiz-setup').classList.remove('hidden');
            document.getElementById('quiz-game').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
        }

        function startQuiz() {
            if (students.length < 4) {
                showModal("提示", "最少需要 4 位同學才能開始測驗！", "fa-solid fa-triangle-exclamation");
                return;
            }
            quizQuestions = [...students].sort(() => 0.5 - Math.random());
            currentQuizIndex = 0;
            quizScore = 0;

            document.getElementById('quiz-setup').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-game').classList.remove('hidden');
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentQuizIndex >= quizQuestions.length) {
                document.getElementById('quiz-game').classList.add('hidden');
                document.getElementById('quiz-result').classList.remove('hidden');
                document.getElementById('final-score-text').innerText = `你的最終得分是：${quizScore} / ${quizQuestions.length}`;
                return;
            }

            const currentStudent = quizQuestions[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `題目 ${currentQuizIndex + 1} / ${quizQuestions.length}`;
            document.getElementById('quiz-score').innerText = `得分: ${quizScore}`;
            document.getElementById('quiz-img').src = currentStudent.photo;

            let options = [currentStudent.name];
            while (options.length < 4 && options.length < students.length) {
                let randomStudent = students[Math.floor(Math.random() * students.length)];
                if (!options.includes(randomStudent.name)) {
                    options.push(randomStudent.name);
                }
            }
            options.sort(() => 0.5 - Math.random());

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full py-3 px-4 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-2xl text-sm font-medium text-slate-700 transition shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, currentStudent.name);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                quizScore++;
                showModal("答對了！", "做得好！繼續保持。", "fa-solid fa-circle-check");
            } else {
                showModal("答錯了", `正確答案是：${correct}`, "fa-solid fa-circle-xmark");
            }
            currentQuizIndex++;
            setTimeout(() => {
                closeModal();
                loadQuizQuestion();
            }, 1200);
        }

        function renderStudentTable() {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';
            students.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="py-3 px-4 flex items-center space-x-3">
                        <img src="${student.photo}" class="w-10 h-10 rounded-xl object-cover shadow-sm bg-slate-100 flex-shrink-0" onerror="this.src='https://placehold.co/100x100/e2e8f0/475569?text=No'">
                        <span class="text-xs text-slate-400 font-mono truncate max-w-xs">${student.photo.substring(0, 30)}...</span>
                    </td>
                    <td class="py-3 px-4 font-medium text-slate-700">${student.name}</td>
                    <td class="py-3 px-4 text-right space-x-2">
                        <button onclick="editStudent(${index})" class="text-indigo-600 hover:text-indigo-800 text-xs bg-indigo-50 px-2.5 py-1 rounded-lg font-medium transition">編輯</button>
                        <button onclick="deleteStudent(${index})" class="text-rose-600 hover:text-rose-800 text-xs bg-rose-50 px-2.5 py-1 rounded-lg font-medium transition">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openAddModal() {
            document.getElementById('modal-form-title').innerText = "新增同學資料";
            document.getElementById('edit-index').value = "-1";
            document.getElementById('input-name').value = "";
            document.getElementById('input-photo').value = "";
            document.getElementById('student-modal').classList.remove('hidden');
        }

        function editStudent(index) {
            const student = students[index];
            document.getElementById('modal-form-title').innerText = "編輯同學資料";
            document.getElementById('edit-index').value = index;
            document.getElementById('input-name').value = student.name;
            document.getElementById('input-photo').value = student.photo;
            document.getElementById('student-modal').classList.remove('hidden');
        }

        function closeStudentModal() {
            document.getElementById('student-modal').classList.add('hidden');
        }

        function saveStudent() {
            const index = parseInt(document.getElementById('edit-index').value);
            const name = document.getElementById('input-name').value.trim();
            const photo = document.getElementById('input-photo').value.trim();

            if (!name) {
                showModal("提示", "請輸入同學姓名！", "fa-solid fa-triangle-exclamation");
                return;
            }

            if (index === -1) {
                students.push({ name, photo: photo || "https://placehold.co/200x200/indigo/white?text=No+Photo" });
            } else {
                students[index] = { name, photo: photo || students[index].photo };
            }

            closeStudentModal();
            renderStudentTable();
            updateStudyCard();
            updateCounts();
            showModal("成功", "同學資料已儲存！", "fa-solid fa-circle-check");
        }

        function deleteStudent(index) {
            if (students.length <= 1) {
                showModal("提示", "最少需要保留一位同學！", "fa-solid fa-triangle-exclamation");
                return;
            }
            students.splice(index, 1);
            renderStudentTable();
            updateStudyCard();
            updateCounts();
            showModal("成功", "已成功刪除該同學！", "fa-solid fa-circle-check");
        }

        function prepareCSVTextarea() {
            let csvLines = students.map(s => `"${s.name}","${s.photo.replace(/"/g, '""')}"`).join("\n");
            document.getElementById('csv-text-input').value = csvLines;
        }

        function handleCSVFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('csv-text-input').value = e.target.result;
                showModal("讀取成功", "CSV 檔案內容已載入到下方文字框，請點擊「確認批次更新」生效。", "fa-solid fa-file-csv");
            };
            reader.readAsText(file, "UTF-8");
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                
                let match = line.match(/^"?(.*?)"?,\s*"?([\s\S]*)"?$/);
                if (match) {
                    let name = match[1].trim();
                    let photo = match[2].trim().replace(/^"|"$/g, '');
                    if (name) {
                        result.push({ name, photo: photo || "https://placehold.co/200x200/indigo/white?text=No+Photo" });
                    }
                } else {
                    let parts = line.split(',');
                    if (parts.length >= 2) {
                        let name = parts[0].trim().replace(/^"|"$/g, '');
                        let photo = parts.slice(1).join(',').trim().replace(/^"|"$/g, '');
                        if (name) {
                            result.push({ name, photo: photo || "https://placehold.co/200x200/indigo/white?text=No+Photo" });
                        }
                    }
                }
            }
            return result;
        }

        function importCSVData() {
            const text = document.getElementById('csv-text-input').value;
            const parsed = parseCSV(text);
            if (parsed.length === 0) {
                showModal("格式錯誤", "未能解析任何有效的同學資料，請確保每行格式為：姓名,Base64或圖片網址", "fa-solid fa-triangle-exclamation");
                return;
            }
            students = parsed;
            currentStudyIndex = 0;
            updateCounts();
            showModal("批次更新成功", `已成功載入 ${students.length} 位同學的資料！`, "fa-solid fa-circle-check");
            switchTab('study');
        }

        function exportCurrentToCSV() {
            let csvContent = students.map(s => `"${s.name}","${s.photo}"`).join("\n");
            let blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'students_flashcard.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function downloadCSVTemplate() {
            let template = "陳大文,https://placehold.co/200x200/indigo/white?text=Chan+Tai+Man\n李小龍,https://placehold.co/200x200/slate/white?text=Lee+Siu+Lung";
            let blob = new Blob(["\uFEFF" + template], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'student_template.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.onload = function() {
            updateCounts();
            updateStudyCard();
        };
    </script>

</body>
</html>
