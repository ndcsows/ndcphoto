<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>積分應用：旋轉體體積視覺化 | Solid of Revolution Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: none; background: #0f172a; height: 100vh; display: flex; flex-direction: column; }
        #canvas-container { width: 100%; flex: 1; min-height: 55vh; background: #0f172a; cursor: move; touch-action: none; position: relative; }
        .control-panel { 
            height: auto;
            max-height: 45vh;
            overflow-y: auto; 
            padding: 24px; 
            background: #ffffff; 
            border-top: 1px solid #e2e8f0; 
            -webkit-overflow-scrolling: touch; 
            flex-shrink: 0;
            z-index: 10;
        }
        
        .axis-label {
            position: absolute;
            color: white;
            font-weight: bold;
            font-style: italic;
            font-family: 'serif';
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 40;
        }
        .zoom-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .lang-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        input[type=range] { 
            accent-color: #3b82f6; 
            height: 2.5rem;
            width: 100%;
        }
        select {
            height: 52px;
            padding: 0 16px;
            -webkit-appearance: none;
            background-color: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.2rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-900">

    <!-- Fixed Language Toggle -->
    <div class="lang-toggle-container">
        <button onclick="toggleLanguage()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl shadow-2xl font-bold text-sm border-2 border-white/20 active:scale-95 flex items-center gap-2 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path d="M4.545 6.714 4.11 8H3l1.862-5h1.284L8 8H6.846l-.435-1.286H4.545zm1.637-1.132L5.432 3.535 4.636 5.582h1.546z"/>
                <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm1 0v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1z"/>
            </svg>
            <span id="btn-lang-text">English / 中文</span>
        </button>
    </div>

    <div id="canvas-container">
        <div id="label-x" class="axis-label">x</div>
        <div id="label-y" class="axis-label">y</div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoom(0.85)">+</button>
            <button class="zoom-btn" onclick="zoom(1.15)">−</button>
        </div>
    </div>

    <!-- Data Info Panel -->
    <div id="data-panel" class="absolute top-4 left-4 bg-slate-900/90 text-white p-5 rounded-2xl border border-slate-700 pointer-events-none hidden backdrop-blur-md z-20 shadow-2xl">
        <div id="lang-dataTitle" class="text-xs uppercase tracking-widest text-blue-400 mb-2 font-black">當前切片數據</div>
        <div class="space-y-2 font-mono text-lg">
            <div class="flex justify-between gap-4">
                <span id="lang-pos" class="text-slate-400">位置</span> 
                <span class="text-white">x = <span id="data-x" class="text-blue-300">0.00</span></span>
            </div>
            <div class="flex justify-between gap-4">
                <span id="lang-rad" class="text-slate-400">半徑</span> 
                <span class="text-white">r = <span id="data-r" class="text-yellow-300">0.00</span></span>
            </div>
            <div class="flex justify-between gap-4">
                <span id="lang-area" class="text-slate-400">面積</span> 
                <span class="text-white">A = <span id="data-a" class="text-green-300">0.00</span></span>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12">
            <!-- Params -->
            <div class="space-y-6">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                    <h1 id="lang-paramTitle" class="text-xl font-black text-slate-800 tracking-tight uppercase">參數控制</h1>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label id="lang-funcSelect" class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">函數選擇</label>
                        <select id="funcSelect" onchange="changeFunc(this.value)" class="w-full shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="linear">y = 0.5x</option>
                            <option value="sqrt">y = √x</option>
                            <option value="sin">y = sin(x) + 1</option>
                            <option value="sqrt2x1">y = √(2x + 1)</option>
                            <option value="invSqrt">y = 1/√x (x: 1~4)</option>
                            <option value="ellipse">4x² + 9y² = 36</option>
                        </select>
                    </div>
                    
                    <div id="angleControlGroup">
                        <div class="flex justify-between text-xs font-bold text-slate-500 mb-1 uppercase tracking-widest">
                            <span id="lang-rotAngle">旋轉角度</span>
                            <span id="angleValue" class="text-blue-600 font-black">0°</span>
                        </div>
                        <input type="range" id="angleSlider" min="270" max="630" value="270" oninput="handleAngleInput(this.value)">
                    </div>
                </div>

                <div id="sliceControl" class="p-6 bg-amber-50 rounded-2xl border border-amber-200 hidden">
                    <div class="flex justify-between text-xs font-bold text-amber-700 mb-2 uppercase tracking-widest">
                        <span id="lang-sliceDisc">切片位置 (x)</span>
                        <span id="sliceValue" class="text-amber-900 font-black">x = 2.0</span>
                    </div>
                    <input type="range" id="sliceSlider" min="0" max="400" value="200" oninput="handleSliceInput(this.value)">
                </div>
            </div>

            <!-- View Options -->
            <div class="space-y-6">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-6 bg-green-600 rounded-full"></div>
                    <h2 id="lang-dispTitle" class="text-xl font-black text-slate-800 tracking-tight uppercase">顯示選項</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <button id="btn-mesh" onclick="toggleMesh()" class="w-full px-4 py-4 rounded-xl text-sm font-bold shadow-lg transition-all active:scale-95">顯示/隱藏立體</button>
                    <button id="btn-riemann" onclick="toggleRiemann()" class="w-full px-4 py-4 rounded-xl text-sm font-bold shadow-md transition-all active:scale-95">黎散圓盤 (Riemann)</button>
                    <button id="btn-disc" onclick="toggleDisc()" class="w-full px-4 py-4 rounded-xl text-sm font-bold shadow-md transition-all active:scale-95">單個切片 (Disc)</button>
                </div>
                
                <div id="nControl" class="p-6 bg-indigo-50 rounded-2xl border border-indigo-100 hidden">
                    <div class="flex justify-between text-xs font-bold text-indigo-700 mb-2 uppercase tracking-widest">
                        <span id="lang-riemannLabel">圓盤數量 (n)</span>
                        <span id="nValue" class="text-indigo-900 font-black">10</span>
                    </div>
                    <input type="range" id="nSlider" min="2" max="100" value="10" oninput="handleNInput(this.value)">
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, curveLine, rotationMesh, discMesh, riemannGroup;
        let angle = 270;
        let slicePos = 2.0;
        let numDiscs = 10; 
        let currentFuncType = 'linear';
        let showMesh = true;
        let showDisc = false;
        let showRiemann = false; 
        let currentLang = 'zh';

        const i18n = {
            zh: {
                dataTitle: "當前切片數據",
                pos: "位置",
                rad: "半徑",
                area: "面積",
                paramTitle: "參數控制",
                funcSelect: "函數選擇",
                rotAngle: "旋轉角度",
                sliceDisc: "切片位置 (x)",
                riemannLabel: "圓盤數量 (n)",
                dispTitle: "顯示選項",
                btnMesh: "顯示/隱藏立體",
                btnRiemann: "黎散圓盤",
                btnDisc: "單個切片",
                btnLang: "English / 中文"
            },
            en: {
                dataTitle: "Slice Information",
                pos: "Position",
                rad: "Radius",
                area: "Area",
                paramTitle: "Parameter Control",
                funcSelect: "Function Selection",
                rotAngle: "Rotation Angle",
                sliceDisc: "Slice Position (x)",
                riemannLabel: "Number of Discs (n)",
                dispTitle: "Display Options",
                btnMesh: "Show/Hide Solid",
                btnRiemann: "Riemann Discs",
                btnDisc: "Single Slice",
                btnLang: "中文 / English"
            }
        };

        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            const dict = i18n[currentLang];

            document.getElementById('btn-lang-text').innerText = dict.btnLang;
            document.getElementById('lang-dataTitle').innerText = dict.dataTitle;
            document.getElementById('lang-pos').innerText = dict.pos;
            document.getElementById('lang-rad').innerText = dict.rad;
            document.getElementById('lang-area').innerText = dict.area;
            document.getElementById('lang-paramTitle').innerText = dict.paramTitle;
            document.getElementById('lang-funcSelect').innerText = dict.funcSelect;
            document.getElementById('lang-rotAngle').innerText = dict.rotAngle;
            document.getElementById('lang-sliceDisc').innerText = dict.sliceDisc;
            document.getElementById('lang-riemannLabel').innerText = dict.riemannLabel;
            document.getElementById('lang-dispTitle').innerText = dict.dispTitle;
            
            document.getElementById('btn-mesh').innerText = dict.btnMesh;
            document.getElementById('btn-riemann').innerText = dict.btnRiemann;
            document.getElementById('btn-disc').innerText = dict.btnDisc;

            updateGeometry();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight * 0.65), 0.1, 1000);
            camera.position.set(10, 8, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight * 0.65);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const pl = new THREE.PointLight(0xffffff, 1.2);
            pl.position.set(10, 15, 10);
            scene.add(pl);

            const addAxis = (end, color) => {
                const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2, transparent: true, opacity: 0.6 });
                const geom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), end]);
                scene.add(new THREE.Line(geom, mat));
            };
            addAxis(new THREE.Vector3(8,0,0), 0xef4444); 
            addAxis(new THREE.Vector3(0,8,0), 0x22c55e); 
            
            const gridHelper = new THREE.GridHelper(16, 16, 0x334155, 0x1e293b);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            riemannGroup = new THREE.Group();
            scene.add(riemannGroup);

            updateGeometry();
            setupInteractions();
            animate();
        }

        function zoom(factor) {
            const r = camera.position.length();
            const newR = r * factor;
            if (newR > 2 && newR < 50) {
                camera.position.multiplyScalar(factor);
            }
        }

        function updateLabels() {
            const pos_x = new THREE.Vector3(8.2, 0, 0);
            const pos_y = new THREE.Vector3(0, 8.2, 0);
            const project = (vec, elId) => {
                const vector = vec.clone().project(camera);
                const x = (vector.x + 1) * window.innerWidth / 2;
                const y = -(vector.y - 1) * (window.innerHeight * 0.65) / 2;
                const el = document.getElementById(elId);
                if (el) {
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    el.style.display = vector.z > 1 ? 'none' : 'block';
                }
            };
            project(pos_x, 'label-x');
            project(pos_y, 'label-y');
        }

        function f(x) {
            switch(currentFuncType) {
                case 'linear': return 0.5 * x;
                case 'sqrt': return Math.sqrt(x);
                case 'sin': return Math.sin(x) + 1;
                case 'sqrt2x1': return Math.sqrt(2 * x + 1);
                case 'invSqrt': return 1 / Math.sqrt(Math.max(0.1, x));
                case 'ellipse': return Math.sqrt(Math.max(0, 4 - (4/9)*x*x));
                default: return 0.5 * x;
            }
        }

        function getBounds() {
            if (currentFuncType === 'invSqrt') return { min: 1, max: 4 };
            if (currentFuncType === 'ellipse') return { min: -3, max: 3 };
            return { min: 0, max: 4 };
        }

        function updateGeometry() {
            if (curveLine) scene.remove(curveLine);
            if (rotationMesh) scene.remove(rotationMesh);
            if (discMesh) scene.remove(discMesh);
            while(riemannGroup.children.length > 0) riemannGroup.remove(riemannGroup.children[0]);

            const bounds = getBounds();
            const sweep = ((angle - 270) / 360) * Math.PI * 2;
            const start = (270 / 360) * Math.PI * 2;

            const points = [];
            for (let i = 0; i <= 100; i++) {
                let x = bounds.min + (i/100)*(bounds.max-bounds.min);
                points.push(new THREE.Vector3(x, f(x), 0));
            }
            curveLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0x60a5fa, linewidth: 3 }));
            scene.add(curveLine);

            if (showMesh) {
                const lPoints = [];
                for (let i = 0; i <= 50; i++) {
                    let x = bounds.min + (i/50)*(bounds.max-bounds.min);
                    lPoints.push(new THREE.Vector2(f(x), x));
                }
                const geom = new THREE.LatheGeometry(lPoints, 64, start, sweep);
                rotationMesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ 
                    color: 0x3b82f6, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0.5,
                    shininess: 80
                }));
                rotationMesh.rotation.z = -Math.PI / 2;
                scene.add(rotationMesh);
            }

            if (showRiemann) {
                const dx = (bounds.max - bounds.min) / numDiscs;
                for (let i = 0; i < numDiscs; i++) {
                    let x = bounds.min + i * dx + dx/2;
                    let r = f(x);
                    const dGeom = new THREE.CylinderGeometry(r, r, dx * 0.9, 32, 1, false, start, sweep);
                    const dMesh = new THREE.Mesh(dGeom, new THREE.MeshPhongMaterial({ color: 0x6366f1, transparent: true, opacity: 0.7 }));
                    dMesh.rotation.z = Math.PI / 2;
                    dMesh.position.x = x;
                    riemannGroup.add(dMesh);
                }
            }

            if (showDisc) {
                const r = f(slicePos);
                const sGeom = new THREE.CylinderGeometry(r, r, 0.08, 48, 1, false, start, sweep);
                discMesh = new THREE.Mesh(sGeom, new THREE.MeshPhongMaterial({ color: 0xfacc15, emissive: 0x422006, shininess: 100 }));
                discMesh.rotation.z = Math.PI / 2;
                discMesh.position.x = slicePos;
                scene.add(discMesh);

                document.getElementById('data-x').innerText = slicePos.toFixed(2);
                document.getElementById('data-r').innerText = r.toFixed(2);
                document.getElementById('data-a').innerText = (Math.PI * r * r).toFixed(2);
            }
            
            const dict = i18n[currentLang];
            const updateBtn = (id, active, labelKey) => {
                const btn = document.getElementById(id);
                btn.innerText = dict[labelKey];
                if (active) {
                    btn.className = "w-full px-4 py-4 rounded-xl text-xs font-black shadow-lg transition-all active:scale-95 bg-blue-600 text-white uppercase tracking-wider";
                } else {
                    btn.className = "w-full px-4 py-4 rounded-xl text-xs font-black shadow-md transition-all active:scale-95 bg-slate-100 text-slate-500 border border-slate-200 uppercase tracking-wider";
                }
            };
            updateBtn('btn-mesh', showMesh, 'btnMesh');
            updateBtn('btn-riemann', showRiemann, 'btnRiemann');
            updateBtn('btn-disc', showDisc, 'btnDisc');
            
            document.getElementById('nControl').classList.toggle('hidden', !showRiemann);
            document.getElementById('sliceControl').classList.toggle('hidden', !showDisc);
            document.getElementById('data-panel').classList.toggle('hidden', !showDisc);
        }

        function handleAngleInput(val) {
            angle = parseInt(val);
            document.getElementById('angleValue').innerText = (angle - 270) + '°';
            updateGeometry();
        }

        function handleNInput(val) {
            numDiscs = parseInt(val);
            document.getElementById('nValue').innerText = numDiscs;
            updateGeometry();
        }

        function handleSliceInput(val) {
            slicePos = val / 100;
            document.getElementById('sliceValue').innerText = `x = ${slicePos.toFixed(1)}`;
            updateGeometry();
        }

        function toggleMesh() { showMesh = !showMesh; updateGeometry(); }
        function toggleDisc() { showDisc = !showDisc; updateGeometry(); }
        function toggleRiemann() { showRiemann = !showRiemann; updateGeometry(); }

        function changeFunc(val) {
            currentFuncType = val;
            const b = getBounds();
            slicePos = (b.min + b.max) / 2;
            const s = document.getElementById('sliceSlider');
            s.min = b.min * 100; s.max = b.max * 100; s.value = slicePos * 100;
            document.getElementById('sliceValue').innerText = `x = ${slicePos.toFixed(1)}`;
            updateGeometry();
        }

        function setupInteractions() {
            let dragging = false, px = 0, py = 0, initialPinchDist = 0;
            const container = document.getElementById('canvas-container');

            const move = (nx, ny) => {
                if(!dragging) return;
                const dx = nx - px, dy = ny - py;
                const r = camera.position.length();
                let theta = Math.atan2(camera.position.x, camera.position.z);
                let phi = Math.acos(camera.position.y / r);
                theta -= dx * 0.007; phi -= dy * 0.007;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
                camera.position.set(r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.cos(theta));
                camera.lookAt(0,0,0);
                px = nx; py = ny;
            };

            container.addEventListener('wheel', (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.1 : 0.9); }, { passive: false });
            container.addEventListener('mousedown', (e) => { dragging = true; px = e.clientX; py = e.clientY; });
            window.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
            window.addEventListener('mouseup', () => dragging = false);
            
            container.addEventListener('touchstart', (e) => { 
                if (e.touches.length === 2) {
                    dragging = false;
                    initialPinchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                } else {
                    dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY; 
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => { 
                if (e.touches.length === 2) {
                    const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    if (initialPinchDist > 0) {
                        zoom(initialPinchDist / currentDist);
                        initialPinchDist = currentDist;
                    }
                } else if(dragging) { move(e.touches[0].clientX, e.touches[0].clientY); } 
            }, { passive: false });

            window.addEventListener('touchend', () => { dragging = false; initialPinchDist = 0; });
        }

        function animate() { 
            requestAnimationFrame(animate); 
            updateLabels();
            renderer.render(scene, camera); 
        }
        
        window.onresize = () => {
            camera.aspect = window.innerWidth / (window.innerHeight * 0.65);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight * 0.65);
        };
        window.onload = init;
    </script>
</body>
</html>
