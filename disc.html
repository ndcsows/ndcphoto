<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>積分應用：旋轉體體積視覺化 | Solid of Revolution Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; touch-action: none; background: #0f172a; }
        #canvas-container { width: 100%; height: 70vh; background: #0f172a; cursor: move; touch-action: none; }
        .control-panel { 
            height: 30vh; 
            overflow-y: auto; 
            padding: 16px 24px; 
            background: #f8fafc; 
            border-top: 1px solid #e2e8f0; 
            -webkit-overflow-scrolling: touch; 
        }
        
        /* iPad Optimized Touch Targets */
        input[type=range] { 
            accent-color: #3b82f6; 
            height: 2.5rem;
            width: 100%;
        }
        select {
            height: 44px;
            padding: 0 12px;
        }
        button {
            min-height: 48px;
            transition: all 0.2s;
        }
        .btn-active {
            background-color: #1e40af !important;
            transform: scale(0.98);
        }
        .control-group-hidden {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(1);
        }
    </style>
</head>
<body class="bg-slate-900">

    <div id="canvas-container"></div>

    <!-- Language Toggle -->
    <button onclick="toggleLanguage()" class="absolute top-4 right-4 bg-white/90 text-blue-600 px-6 py-2 rounded-full shadow-lg font-bold text-sm z-10 border border-blue-200 active:scale-95">
        中文 / EN
    </button>

    <!-- Data Panel -->
    <div id="data-panel" class="absolute top-4 left-4 bg-slate-900/80 text-white p-4 rounded-xl border border-slate-700 pointer-events-none hidden backdrop-blur-sm">
        <div id="lang-data-title" class="text-xs uppercase tracking-wider text-slate-400 mb-1 font-bold">當前切片數據</div>
        <div class="space-y-1 font-mono text-base">
            <div><span id="lang-pos">位置</span> x = <span id="data-x" class="text-blue-400">0.00</span></div>
            <div><span id="lang-rad">半徑</span> r = <span id="data-r" class="text-yellow-400">0.00</span></div>
            <div><span id="lang-area">面積</span> A = <span id="data-a" class="text-green-400">0.00</span></div>
        </div>
    </div>

    <div class="control-panel">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- 參數調整 -->
            <div class="space-y-4">
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-6 bg-blue-600 rounded"></div>
                    <h1 id="lang-param-title" class="text-lg font-bold text-gray-800 uppercase">參數控制</h1>
                </div>
                
                <div>
                    <label id="lang-func-select" class="block text-xs font-bold text-gray-500 mb-2 uppercase">函數選擇</label>
                    <select id="funcSelect" onchange="changeFunc(this.value)" class="w-full border-2 border-slate-200 rounded-xl bg-white text-base shadow-sm focus:border-blue-500 outline-none">
                        <option value="linear">y = 0.5x</option>
                        <option value="sqrt">y = √x</option>
                        <option value="sin">y = sin(x) + 1</option>
                        <option value="sqrt2x1">y = √(2x + 1)</option>
                        <option value="invSqrt">y = 1/√x (x: 1~4)</option>
                        <option value="ellipse">4x² + 9y² = 36</option>
                    </select>
                </div>
                
                <div id="angleControlGroup">
                    <div class="flex justify-between text-xs font-bold text-gray-500 mb-1 uppercase">
                        <span id="lang-rot-angle">旋轉角度</span>
                        <span id="angleValue" class="text-blue-600 font-mono">0°</span>
                    </div>
                    <input type="range" id="angleSlider" min="270" max="630" value="270">
                </div>
            </div>

            <!-- 視覺切換 -->
            <div class="space-y-4">
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-6 bg-green-600 rounded"></div>
                    <h2 id="lang-disp-title" class="text-lg font-bold text-gray-800 uppercase">顯示選項</h2>
                </div>
                <div class="grid grid-cols-1 gap-2">
                    <button id="btn-mesh" onclick="toggleMesh()" class="w-full px-4 py-3 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md active:bg-blue-800">顯示/隱藏立體</button>
                    <button id="btn-riemann" onclick="toggleRiemann()" class="w-full px-4 py-3 bg-slate-200 text-slate-700 rounded-xl text-sm font-bold shadow-sm active:bg-slate-300">黎散圓盤 (Riemann)</button>
                    <button id="btn-disc" onclick="toggleDisc()" class="w-full px-4 py-3 bg-slate-200 text-slate-700 rounded-xl text-sm font-bold shadow-sm active:bg-slate-300">單個切片 (Disc)</button>
                </div>
                
                <div id="nControl" class="p-4 bg-indigo-50 rounded-2xl border border-indigo-100 hidden">
                    <div class="flex justify-between text-xs font-bold text-indigo-700 mb-1 uppercase">
                        <span id="lang-riemann">圓盤數量 (n)</span>
                        <span id="nValue" class="text-indigo-800">10</span>
                    </div>
                    <input type="range" id="nSlider" min="2" max="100" value="10">
                </div>

                <div id="sliceControl" class="p-4 bg-yellow-50 rounded-2xl border border-yellow-200 hidden">
                    <div class="flex justify-between text-xs font-bold text-yellow-700 mb-1 uppercase">
                        <span id="lang-slice-disc">切片位置 (x)</span>
                        <span id="sliceValue" class="text-yellow-800">x = 2.0</span>
                    </div>
                    <input type="range" id="sliceSlider" min="0" max="400" value="200">
                </div>
            </div>

            <!-- 公式展示 -->
            <div class="bg-slate-900 p-6 rounded-3xl text-white shadow-2xl flex flex-col justify-center border border-slate-800">
                <h2 id="lang-math-title" class="font-bold text-blue-400 mb-4 border-b border-slate-800 pb-2 text-base tracking-widest">數學原理</h2>
                <div class="space-y-4">
                    <p id="lang-math-desc" class="text-sm opacity-70 leading-relaxed">體積為圓盤面積的積分：</p>
                    <div class="bg-slate-800/80 p-3 rounded-xl text-center shadow-inner">
                        <span class="text-lg text-yellow-400 font-serif">$dV = \pi[f(x)]^2 dx$</span>
                    </div>
                    <div class="bg-slate-800/80 p-3 rounded-xl text-center shadow-inner">
                        <span class="text-2xl font-serif">$V = \pi \int_{a}^{b} [f(x)]^2 dx$</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, curveLine, rotationMesh, discMesh, riemannGroup;
        let xLabel, yLabel;
        let angle = 270;
        let slicePos = 2.0;
        let numDiscs = 10; 
        let currentFuncType = 'linear';
        let showMesh = true;
        let showDisc = false;
        let showRiemann = false; 
        let currentLang = 'zh';

        const i18n = {
            zh: {
                dataTitle: "當前切片數據",
                pos: "位置",
                rad: "半徑",
                area: "面積",
                paramTitle: "參數控制",
                funcSelect: "函數選擇",
                rotAngle: "旋轉角度",
                sliceDisc: "切片位置 (x)",
                riemann: "圓盤數量 (n)",
                dispTitle: "顯示選項",
                mathTitle: "數學原理",
                mathDesc: "體積為圓盤面積的積分：",
                xAxis: "x",
                yAxis: "y"
            },
            en: {
                dataTitle: "Slice Info",
                pos: "Position",
                rad: "Radius",
                area: "Area",
                paramTitle: "Parameters",
                funcSelect: "Function",
                rotAngle: "Rotation Angle",
                sliceDisc: "Slice Pos (x)",
                riemann: "Discs (n)",
                dispTitle: "Display Options",
                mathTitle: "Math Theory",
                mathDesc: "Volume is the integral of area:",
                xAxis: "x",
                yAxis: "y"
            }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight * 0.7), 0.1, 1000);
            camera.position.set(10, 8, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight * 0.7);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const pl = new THREE.PointLight(0xffffff, 1);
            pl.position.set(5, 10, 8);
            scene.add(pl);

            // Axes
            const addAxis = (end, color, label) => {
                const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
                const geom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), end]);
                scene.add(new THREE.Line(geom, mat));
            };
            addAxis(new THREE.Vector3(6,0,0), 0xef4444); // x
            addAxis(new THREE.Vector3(0,6,0), 0x22c55e); // y
            
            const gridHelper = new THREE.GridHelper(12, 12, 0x334155, 0x1e293b);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            riemannGroup = new THREE.Group();
            scene.add(riemannGroup);

            updateGeometry();
            setupInteractions();
            animate();
        }

        function f(x) {
            switch(currentFuncType) {
                case 'linear': return 0.5 * x;
                case 'sqrt': return Math.sqrt(x);
                case 'sin': return Math.sin(x) + 1;
                case 'sqrt2x1': return Math.sqrt(2 * x + 1);
                case 'invSqrt': return 1 / Math.sqrt(Math.max(0.1, x));
                case 'ellipse': return Math.sqrt(Math.max(0, 4 - (4/9)*x*x));
                default: return 0.5 * x;
            }
        }

        function getBounds() {
            if (currentFuncType === 'invSqrt') return { min: 1, max: 4 };
            if (currentFuncType === 'ellipse') return { min: -3, max: 3 };
            return { min: 0, max: 4 };
        }

        function updateGeometry() {
            if (curveLine) scene.remove(curveLine);
            if (rotationMesh) scene.remove(rotationMesh);
            if (discMesh) scene.remove(discMesh);
            while(riemannGroup.children.length > 0) riemannGroup.remove(riemannGroup.children[0]);

            const bounds = getBounds();
            const sweep = ((angle - 270) / 360) * Math.PI * 2;
            const start = (270 / 360) * Math.PI * 2;

            // 1. Curve
            const points = [];
            for (let i = 0; i <= 100; i++) {
                let x = bounds.min + (i/100)*(bounds.max-bounds.min);
                points.push(new THREE.Vector3(x, f(x), 0));
            }
            curveLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0x60a5fa, linewidth: 3 }));
            scene.add(curveLine);

            // 2. Solid Mesh
            if (showMesh) {
                const lPoints = [];
                for (let i = 0; i <= 50; i++) {
                    let x = bounds.min + (i/50)*(bounds.max-bounds.min);
                    lPoints.push(new THREE.Vector2(f(x), x));
                }
                const geom = new THREE.LatheGeometry(lPoints, 64, start, sweep);
                rotationMesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ color: 0x3b82f6, side: THREE.DoubleSide, transparent: true, opacity: 0.4 }));
                rotationMesh.rotation.z = -Math.PI / 2;
                scene.add(rotationMesh);
            }

            // 3. Riemann Discs
            if (showRiemann) {
                const dx = (bounds.max - bounds.min) / numDiscs;
                for (let i = 0; i < numDiscs; i++) {
                    let x = bounds.min + i * dx + dx/2;
                    let r = f(x);
                    const dGeom = new THREE.CylinderGeometry(r, r, dx * 0.95, 32, 1, false, start, sweep);
                    const dMesh = new THREE.Mesh(dGeom, new THREE.MeshPhongMaterial({ color: 0x6366f1, transparent: true, opacity: 0.6 }));
                    dMesh.rotation.z = Math.PI / 2;
                    dMesh.position.x = x;
                    riemannGroup.add(dMesh);
                }
            }

            // 4. Single Slice
            if (showDisc) {
                const r = f(slicePos);
                const sGeom = new THREE.CylinderGeometry(r, r, 0.05, 48, 1, false, start, sweep);
                discMesh = new THREE.Mesh(sGeom, new THREE.MeshPhongMaterial({ color: 0xfacc15, emissive: 0x422006 }));
                discMesh.rotation.z = Math.PI / 2;
                discMesh.position.x = slicePos;
                scene.add(discMesh);

                document.getElementById('data-x').innerText = slicePos.toFixed(2);
                document.getElementById('data-r').innerText = r.toFixed(2);
                document.getElementById('data-a').innerText = (Math.PI * r * r).toFixed(2);
            }

            // UI State Sync
            const isAnythingRotatable = showMesh || showRiemann || showDisc;
            document.getElementById('angleControlGroup').className = isAnythingRotatable ? '' : 'control-group-hidden';
            
            // Button Styles
            const updateBtn = (id, active) => {
                const btn = document.getElementById(id);
                if (active) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-slate-200', 'text-slate-700');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('bg-slate-200', 'text-slate-700');
                }
            };
            updateBtn('btn-mesh', showMesh);
            updateBtn('btn-riemann', showRiemann);
            updateBtn('btn-disc', showDisc);
            
            document.getElementById('nControl').classList.toggle('hidden', !showRiemann);
            document.getElementById('sliceControl').classList.toggle('hidden', !showDisc);
            document.getElementById('data-panel').classList.toggle('hidden', !showDisc);
        }

        function toggleMesh() { showMesh = !showMesh; updateGeometry(); }
        function toggleDisc() { showDisc = !showDisc; updateGeometry(); }
        function toggleRiemann() { showRiemann = !showRiemann; updateGeometry(); }

        function changeFunc(val) {
            currentFuncType = val;
            const b = getBounds();
            slicePos = (b.min + b.max) / 2;
            const s = document.getElementById('sliceSlider');
            s.min = b.min * 100; s.max = b.max * 100; s.value = slicePos * 100;
            document.getElementById('sliceValue').innerText = `x = ${slicePos.toFixed(1)}`;
            updateGeometry();
        }

        function setupInteractions() {
            let dragging = false, px = 0, py = 0;
            const move = (nx, ny) => {
                if(!dragging) return;
                const dx = nx - px, dy = ny - py;
                const r = camera.position.length();
                let theta = Math.atan2(camera.position.x, camera.position.z);
                let phi = Math.acos(camera.position.y / r);
                theta -= dx * 0.005; phi -= dy * 0.005;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
                camera.position.set(r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.cos(theta));
                camera.lookAt(0,0,0);
                px = nx; py = ny;
            };
            const c = document.getElementById('canvas-container');
            c.onmousedown = (e) => { dragging = true; px = e.clientX; py = e.clientY; };
            window.onmousemove = (e) => move(e.clientX, e.clientY);
            window.onmouseup = () => dragging = false;
            
            c.ontouchstart = (e) => { dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY; };
            window.ontouchmove = (e) => { if(dragging) { move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } };
            window.ontouchend = () => dragging = false;
        }

        document.getElementById('angleSlider').oninput = (e) => {
            angle = parseInt(e.target.value);
            document.getElementById('angleValue').innerText = (angle - 270) + '°';
            updateGeometry();
        };
        document.getElementById('nSlider').oninput = (e) => {
            numDiscs = parseInt(e.target.value);
            document.getElementById('nValue').innerText = numDiscs;
            updateGeometry();
        };
        document.getElementById('sliceSlider').oninput = (e) => {
            slicePos = e.target.value / 100;
            document.getElementById('sliceValue').innerText = `x = ${slicePos.toFixed(1)}`;
            updateGeometry();
        };

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const t = i18n[currentLang];
            document.getElementById('lang-data-title').innerText = t.dataTitle;
            ['pos','rad','area','paramTitle','funcSelect','rotAngle','sliceDisc','riemann','dispTitle','mathTitle','mathDesc'].forEach(k => {
                const el = document.getElementById('lang-'+k);
                if(el) el.innerText = t[k];
            });
        }

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        window.onresize = () => {
            camera.aspect = window.innerWidth / (window.innerHeight * 0.7);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight * 0.7);
        };
        window.onload = init;
    </script>
</body>
</html>
