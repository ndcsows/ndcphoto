<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生照片與紀錄系統 (Google Sheet 整合版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900">學生管理系統 (Google Sheet 模式)</h1>
            <div id="user-info" class="text-sm text-gray-600 hidden">
                登入身份: <span id="user-email" class="font-medium text-blue-600"></span>
                <button onclick="logout()" class="ml-4 text-red-500 hover:underline">登出</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- 登入區塊 -->
        <div id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100 text-center">
            <h2 class="text-2xl font-bold mb-4">系統登入</h2>
            <p class="text-gray-500 mb-6 text-sm">請使用您的校園 Google 帳號登入系統</p>
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-sm">
                使用 Google 帳號登入
            </button>
        </div>

        <!-- 學生專區 -->
        <div id="student-section" class="hidden max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-xl font-bold mb-4 text-blue-600">學生個人專區</h2>
            <div id="student-details" class="space-y-4 mb-6">
                <!-- 動態填入學生個人資料 -->
            </div>
            <div class="border-t pt-4">
                <h3 class="font-semibold mb-2">更新簽名或資料</h3>
                <textarea id="student-remark" class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="輸入備註或修改事項..."></textarea>
                <button onclick="submitStudentUpdate()" class="mt-3 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg">
                    提交更新
                </button>
            </div>
        </div>

        <!-- 管理員專區 -->
        <div id="admin-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">管理員控制台</h2>
                <button onclick="refreshData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium">
                    強制重新整理 (清除快取)
                </button>
            </div>
            <div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b text-sm text-gray-600">
                                <th class="p-4">電郵</th>
                                <th class="p-4">姓名</th>
                                <th class="p-4">狀態</th>
                                <th class="p-4">操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-student-list" class="divide-y divide-gray-200 text-sm">
                            <!-- 資料將由 Google Sheet API 載入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        &copy; 2026 校園學生照片與紀錄系統 - Google Sheet API 整合架構
    </footer>

    <script>
        // 設定您的 Google Apps Script Web App 部署網址
        const GAS_WEB_APP_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

        // 寫死的手動管理員清單
        const ADMIN_EMAILS = ['ndcsows@ndc.edu.hk'];

        let currentUser = null;
        let studentsCache = null; // 本地快取，減少重複讀取

        // 模擬登入流程
        function handleLogin() {
            // 實際應用中可整合 Firebase Auth 或 Google Sign-In，此處以手動輸入或授權模擬
            const email = prompt("請輸入您的登入信箱 (例如 ndcsows@ndc.edu.hk):");
            if (!email) return;

            currentUser = { email: email.trim().toLowerCase() };
            document.getElementById('user-email').textContent = currentUser.email;
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('login-section').classList.add('hidden');

            checkUserRole();
        }

        // 檢查權限並載入對應畫面
        async function checkUserRole() {
            if (ADMIN_EMAILS.includes(currentUser.email)) {
                document.getElementById('admin-section').classList.remove('hidden');
                await loadAdminDataFromSheet();
            } else {
                document.getElementById('student-section').classList.remove('hidden');
                await loadStudentDataFromSheet();
            }
        }

        // 從 Google Sheet 讀取資料 (帶快取機制，大幅節省讀取次數)
        async function fetchFromSheet(sheetName, forceRefresh = false) {
            if (!forceRefresh && sheetName === 'students' && studentsCache) {
                console.log('使用本地快取資料，未消耗額外讀取次數');
                return studentsCache;
            }

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get', sheet: sheetName })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    if (sheetName === 'students') studentsCache = result.data;
                    return result.data;
                } else {
                    throw new Error('讀取失敗');
                }
            } catch (error) {
                console.error('API 錯誤:', error);
                alert('無法連線至 Google Sheet 服務，請檢查網路或 API 設定。');
                return [];
            }
        }

        // 載入管理員資料
        async function loadAdminDataFromSheet(force = false) {
            const listEl = document.getElementById('admin-student-list');
            listEl.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">正在從 Google Sheet 載入資料...</td></tr>';
            
            const students = await fetchFromSheet('students', force);
            
            listEl.innerHTML = '';
            if (students.length === 0) {
                listEl.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">目前沒有資料</td></tr>';
                return;
            }

            students.forEach(student => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4">${student.email || ''}</td>
                    <td class="p-4">${student.name || '未命名'}</td>
                    <td class="p-4"><span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-xs">已同步</span></td>
                    <td class="p-4"><button onclick="alert('檢視 ${student.email}')" class="text-blue-600 hover:underline">詳情</button></td>
                `;
                listEl.appendChild(tr);
            });
        }

        // 載入學生個人資料
        async function loadStudentDataFromSheet() {
            const detailsEl = document.getElementById('student-details');
            detailsEl.innerHTML = '<p class="text-gray-500">載入個人資料中...</p>';

            const students = await fetchFromSheet('students');
            const myData = students.find(s => s.email && s.email.toLowerCase() === currentUser.email);

            if (myData) {
                detailsEl.innerHTML = `
                    <p><strong>姓名：</strong> ${myData.name || '未設定'}</p>
                    <p><strong>電郵：</strong> ${myData.email}</p>
                    <p><strong>狀態：</strong> 已登記</p>
                `;
            } else {
                detailsEl.innerHTML = `<p class="text-red-500">找不到您的學生記錄，請聯絡管理員 (${currentUser.email})。</p>`;
            }
        }

        // 提交學生更新
        async function submitStudentUpdate() {
            const remark = document.getElementById('student-remark').value;
            if (!remark) {
                alert('請輸入內容後再提交');
                return;
            }

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'save',
                        sheet: 'student_record',
                        email: currentUser.email,
                        remark: remark,
                        timestamp: new Date().toISOString()
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert('更新成功！資料已寫入 Google Sheet');
                    document.getElementById('student-remark').value = '';
                } else {
                    alert('儲存失敗');
                }
            } catch (err) {
                console.error(err);
                alert('寫入發生錯誤');
            }
        }

        // 強制重新整理
        function refreshData() {
            studentsCache = null; // 清除快取
            loadAdminDataFromSheet(true);
            alert('已清除快取並重新向 Google Sheet 要求最新資料！');
        }

        // 登出
        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
